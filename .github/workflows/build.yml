name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            command: npm run dist:mac
            artifact: |
              release/*.dmg
              release/*.zip
          - name: macos-x64
            os: macos-15-intel
            command: npm run dist:mac:x64
            artifact: |
              release/*.dmg
              release/*.zip
          - name: windows-x64
            os: windows-latest
            command: npm run dist:win
            artifact: release/*.exe
          - name: linux-x64
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: release/*.AppImage

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chat-connect-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
